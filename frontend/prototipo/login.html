<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar · Mineração de Texto e PLN (protótipo)</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <div class="container">
      <a class="logo-area" href="index.html" aria-label="Início">
        <span class="logo-chip"><img class="logo-unilins" src="img/logo-unilins.png" alt="UNILINS" height="34"></span>
        <div class="logo-texto"><strong>Mineração de Texto e PLN</strong><span>Estudo de caso: COVID-19</span></div>
      </a>
    </div>
  </header>

  <main id="conteudo">
    <section class="bloco">
      <div class="container" style="max-width:520px">
        <p class="migalhas"><a href="index.html">Início</a> / Entrar</p>
        <h1 class="titulo-pagina">Entrar na plataforma</h1>
        <p class="subtitulo">Entre com o e-mail e a senha que você cadastrou.</p>

        <div class="card" style="display:grid; gap:1rem">
          <form id="form-entrar" style="display:grid; gap:1rem">
            <div class="campo">
              <label for="login-email">E-mail</label>
              <input id="login-email" name="email" type="email" required maxlength="255" autocomplete="email" />
            </div>
            <div class="campo">
              <label for="login-senha">Senha</label>
              <input id="login-senha" name="senha" type="password" required maxlength="128" autocomplete="current-password" />
            </div>
            <p id="aviso-entrar" role="alert" hidden style="margin:0; color:#b00020"></p>
            <button class="btn btn-escuro" type="submit">Entrar</button>
          </form>
          <p style="margin:0; font-size:.9rem">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <p class="rodape-base">Protótipo de interface · Política de privacidade a elaborar conforme a LGPD.</p>
    </div>
  </footer>

  <p id="mensagem-global" role="status" class="sr-only"></p>
  <script src="js/comum.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

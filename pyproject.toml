# Usado pelo Vercel para instalar as dependências do back-end.
# Mantenha a lista de dependências igual à de backend/requirements.txt (usado localmente e no Docker).
[project]
name = "plataforma-pln"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "pytest>=8",
    "python-dotenv>=1.0",
]
